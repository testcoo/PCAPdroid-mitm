plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    signingConfigs {
        release {
            storeFile file('../keystore')
            storePassword 'android'
            keyAlias 'key0'
            keyPassword 'android'
        }
    }
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "io.mitmlauncher"
        minSdk 24
        targetSdk 34
        // v0.4.0（M3）：设置页（文件访问权限 + 工作目录）、首页齿轮入口、
        //         未运行时缺权限的红字提示、Python 侧 chdir 到工作目录。
        // 每次要出 APK 前顺手 bump，装到手机上能一眼确认装的是哪一版。
        versionCode 45
        versionName "0.4.0"

        // see productFlavors below
        /*ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }*/

        python {
            version "3.13"
            pip {
                install "../submodules/mitmproxy" // 12.3.1
                install "beautifulsoup4"
                options "--find-links", "../submodules/chaquopy-wheels"
            }
            pyc {
                src true
            }
        }
    }

    // NOTE: abi splits currently not supported by chaquopy
    // https://github.com/chaquo/chaquopy/issues/449
    // https://chaquo.com/chaquopy/doc/current/faq.html#faq-size
    flavorDimensions "abi"
    productFlavors {
        arm64 {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        x86_64 {
            dimension "abi"
            ndk { abiFilters "x86_64" }
        }
    }

    buildTypes {
        release {
            if (file('../keystore').exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Compress native libraries in the APK. AGP 8 defaults to uncompressed,
    // page-aligned libs (extractNativeLibs="false"), which inflates standalone
    // APKs by several MB (e.g. libpython3.13.so 1.3MB -> 5.2MB). That trade-off
    // only pays off with Play Store app bundles, but we ship standalone APKs.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // Disable the DEPENDENCY_INFO_BLOCK, which contains an encrypted binary blob
    // with the app dependencies, embedded by the AGP
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'io.mitmlauncher'
}

dependencies {
    // 只为 androidx.core.view 的 WindowInsetsControllerCompat / WindowCompat：
    // 用声明式 API（controller.hide(Type.ime())）收起软键盘。
    // 平台老接口 InputMethodManager.hideSoftInputFromWindow() 是「发一次 RPC 请求」，
    // 在窗口处于焦点切换的过渡态时会被丢弃或被随后的 show 覆盖（真机复现：
    // 点空白第一次不收、第二次才收）。声明式 API 改的是窗口的 Insets 目标状态，
    // 天然免疫这种时序竞态。gradle.properties 里 android.useAndroidX=true 早已开着，
    // 这里只是补一行依赖。
    //
    // ★ 版本受 compileSdk 限制（本项目 compileSdk 34），不用更新的 core。
    implementation 'androidx.core:core:1.13.1'
}
