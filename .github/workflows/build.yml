name: Build MitmLauncher

# 默认不自动构建，避免每次推 master 都烧 CI。
# 触发方式二选一：
#   1) 打 tag（推荐，顺便当版本存档）：git tag v0.2 && git push origin v0.2
#   2) 网页/API 手动触发：Actions → Build MitmLauncher → Run workflow
#      走 GitHub API 的话：POST /repos/{owner}/{repo}/actions/workflows/build.yml/dispatches
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 同一 ref 连点多次只保留最后一次，避免排队堆积。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy needs a matching Python interpreter on the build host.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble arm64 debug APK
        run: ./gradlew assembleArm64Debug --stacktrace

      # 把 versionName/versionCode 拼进 artifact 名，方便一眼认出装的是哪一版。
      - name: Read version from build.gradle
        id: ver
        run: |
          CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "apk=MitmLauncher-v${NAME}-${CODE}-arm64-debug" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.apk }}
          path: app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
